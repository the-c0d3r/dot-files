
repos:
  # generic hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=8192']
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: check-yaml
      - id: pretty-format-json
        args: [--indent=4, --no-sort-keys, --autofix]

  # nix hooks (nixfmt comes from home/programs/cli.nix)
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$
      - id: nix-eval
        name: nix eval all configurations
        entry: scripts/check-eval.sh
        language: system
        files: (\.nix|flake\.lock)$
        pass_filenames: false
